<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyFlix</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>MyFlix</h1>
  </header>

  <main>
    <section class="movie-display">
      <video id="moviePlayer" controls>
        <source src="movie.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </section>

    <section class="movie-thumbnails">
      <h2>Featured Movies</h2>
      <div class="thumbnails">
        <img src="thumb1.jpg" alt="Movie 1" onclick="playMovie('movie1.mp4')" />
        <img src="thumb2.jpg" alt="Movie 2" onclick="playMovie('movie2.mp4')" />
        <img src="thumb3.jpg" alt="Movie 3" onclick="playMovie('movie3.mp4')" />
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
